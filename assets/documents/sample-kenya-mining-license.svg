<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%" fill="none">
  <!-- Document Sheet -->
  <rect width="800" height="1100" fill="#FAF8F5" stroke="#C9A24B" stroke-width="3"/>
  <rect x="25" y="25" width="750" height="1050" fill="none" stroke="#2D3748" stroke-width="1.5"/>
  <rect x="35" y="35" width="730" height="1030" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="6,3"/>

  <!-- Watermark Crest -->
  <circle cx="400" cy="550" r="220" fill="#E2D9C8" opacity="0.18"/>

  <!-- Official Header -->
  <g transform="translate(400, 80)">
    <!-- Coat of Arms Emblem placeholder -->
    <circle cx="0" cy="20" r="30" fill="none" stroke="#715115" stroke-width="2"/>
    <text x="0" y="26" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="16" fill="#715115">REPUBLIC OF KENYA</text>
    <text x="0" y="70" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="14" letter-spacing="2" fill="#1A202C">MINISTRY OF MINING, BLUE ECONOMY AND MARITIME AFFAIRS</text>
    <text x="0" y="92" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#4A5568">STATE DEPARTMENT FOR MINING</text>
    <text x="0" y="110" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#718096">THE MINING ACT (NO. 12 OF 2016)</text>
    <line x1="-300" y1="125" x2="300" y2="125" stroke="#C9A24B" stroke-width="1.5"/>
  </g>

  <!-- Title -->
  <g transform="translate(400, 240)">
    <text x="0" y="0" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="24" letter-spacing="2" fill="#805D17">MINERAL DEALER'S TRADING LICENSE (CLASS A)</text>
    <text x="0" y="24" text-anchor="middle" font-family="'Inter', monospace" font-size="13" font-weight="700" fill="#2D3748">LICENSE NO: ML/GD/2024/7821 [SPECIMEN / REPLACE]</text>
  </g>

  <!-- Body Text -->
  <g transform="translate(80, 310)" font-family="'Inter', sans-serif" font-size="12" fill="#2D3748">
    <text x="0" y="20">THIS IS TO CERTIFY THAT:</text>
    <text x="0" y="50" font-weight="700" font-size="16" fill="#1A202C">AURUM EAST AFRICA PRECIOUS METALS LIMITED</text>
    <text x="0" y="75" fill="#4A5568">Certificate of Incorporation No: CPR/2018/349102</text>
    <text x="0" y="95" fill="#4A5568">Registered Address: Riverside Green Offices, Riverside Drive, P.O. Box 45890-00100, Nairobi</text>

    <text x="0" y="145">has been duly licensed in accordance with Section 159 of the Mining Act to carry on the business</text>
    <text x="0" y="165">of a <tspan font-weight="700">MINERAL DEALER (GOLD, BULLION &amp; ASSOCIATED PRECIOUS METALS)</tspan>.</text>

    <!-- Specific Conditions Table -->
    <g transform="translate(0, 200)">
      <rect width="640" height="230" fill="#F7FAFC" stroke="#E2E8F0" stroke-width="1" rx="6"/>
      <g transform="translate(25, 30)">
        <text x="0" y="0" font-weight="700" fill="#1A202C">LICENSED OPERATIONS:</text>
        <text x="0" y="24" fill="#4A5568">1. Purchase, aggregation, and custody of raw gold doré from licensed artisanal and commercial mines.</text>
        <text x="0" y="48" fill="#4A5568">2. Metallurgical assaying, fire assay, melting, and production of refined 999.9 bullion bars.</text>
        <text x="0" y="72" fill="#4A5568">3. Commercial sale, local distribution, and export under authorized mineral clearance permits.</text>
        
        <text x="0" y="112" font-weight="700" fill="#1A202C">VALIDITY &amp; JURISDICTION:</text>
        <text x="0" y="136" fill="#4A5568">Effective Date: 15th January 2024</text>
        <text x="320" y="136" fill="#4A5568">Expiry Date: 31st December 2026</text>
        <text x="0" y="160" fill="#4A5568">Mining Cadastre Register: Verified &amp; Active</text>
        <text x="320" y="160" fill="#4A5568">Reporting: Monthly Returns Mandatory</text>
      </g>
    </g>

    <!-- Official Seal & Signatures -->
    <g transform="translate(0, 480)">
      <!-- Government Golden Foil Seal -->
      <g transform="translate(100, 100)">
        <circle cx="0" cy="0" r="54" fill="#E8CD78" stroke="#8F6E24" stroke-width="2"/>
        <circle cx="0" cy="0" r="46" fill="none" stroke="#8F6E24" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="0" y="-12" text-anchor="middle" font-size="8" font-weight="700" fill="#4A3508">MINING CADASTRE</text>
        <text x="0" y="6" text-anchor="middle" font-size="10" font-weight="800" fill="#4A3508">SEAL</text>
        <text x="0" y="22" text-anchor="middle" font-size="7" font-weight="600" fill="#4A3508">NAIROBI, KENYA</text>
      </g>

      <!-- Signature Blocks -->
      <g transform="translate(360, 60)">
        <line x1="0" y1="50" x2="240" y2="50" stroke="#1A202C" stroke-width="1"/>
        <text x="0" y="70" font-weight="700" font-size="11" fill="#1A202C">CABINET SECRETARY / DIRECTOR OF MINES</text>
        <text x="0" y="86" font-size="10" fill="#718096">Ministry of Mining, Republic of Kenya</text>
      </g>
    </g>

    <text x="0" y="680" font-size="9" fill="#A0AEC0">Note: This document representation is provided for public verification. Verify authenticity on mining.go.ke/verify-licenses.</text>
  </g>
</svg>
