<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%" fill="none">
  <rect width="800" height="1100" fill="#FAF8F5" stroke="#C9A24B" stroke-width="3"/>
  <rect x="25" y="25" width="750" height="1050" fill="none" stroke="#2D3748" stroke-width="1.5"/>
  <g transform="translate(400, 90)">
    <text x="0" y="25" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="20" fill="#1E40AF">RÉPUBLIQUE DÉMOCRATIQUE DU CONGO</text>
    <text x="0" y="50" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#1A202C">MINISTÈRE DES MINES</text>
    <text x="0" y="70" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#4A5568">Secrétariat Général aux Mines • Division Provinciale du Nord-Kivu</text>
    <line x1="-300" y1="88" x2="300" y2="88" stroke="#C9A24B" stroke-width="1.5"/>
    <text x="0" y="125" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="22" fill="#8F6E24">AGRÉMENT DE COMPTOIR D'ACHAT D'OR</text>
    <text x="0" y="150" text-anchor="middle" font-family="'Inter', monospace" font-size="12" font-weight="700" fill="#2D3748">ARRÊTÉ MINISTÉRIEL N° : RDC/MIN-MINES/CAB.MIN/2024/0412</text>
  </g>
  <g transform="translate(100, 310)" font-family="'Inter', sans-serif" font-size="13" fill="#2D3748">
    <text x="0" y="25">Vu la Loi n° 007/2002 du 11 juillet 2002 portant Code Minier telle que modifiée et complétée ;</text>
    <text x="0" y="60">Est agréé en qualité de <tspan font-weight="700">COMPTOIR D'ACHAT ET DE VENTE D'OR BRUT :</tspan></text>
    <text x="0" y="95" font-weight="700" font-size="16" fill="#1A202C">AURUM EAST AFRICA CONGO S.A.R.L.</text>
    <text x="0" y="120" fill="#4A5568">RCCM : CD/GOM/RCCM/24-B-00812 | Id. Nat. : 01-G4400-N91802</text>
    <text x="0" y="145" fill="#4A5568">Siège d'Exploitation : Avenue du Boulevard 14, Commune de Goma, Nord-Kivu</text>

    <g transform="translate(0, 185)">
      <rect width="600" height="150" fill="#F8FAFC" stroke="#E2E8F0" rx="6"/>
      <text x="25" y="35" font-weight="700" font-size="12" fill="#1E3A8A">CONDITIONS ET TRAÇABILITÉ :</text>
      <text x="25" y="65" font-size="11" fill="#475569">1. Respect strict des normes de diligence raisonnable de l'OCDE (Guide OCDE).</text>
      <text x="25" y="90" font-size="11" fill="#475569">2. Achat exclusif auprès des coopératives minières artisanales dûment qualifiées.</text>
      <text x="25" y="115" font-size="11" fill="#475569">3. Paiement des taxes de sortie et délivrance des certificats de la CIRGL obligatoires.</text>
    </g>

    <g transform="translate(360, 420)">
      <circle cx="80" cy="50" r="48" fill="#1D4ED8" opacity="0.15" stroke="#1D4ED8" stroke-width="1.5"/>
      <text x="80" y="55" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">LE MINISTRE DES MINES</text>
      <text x="80" y="70" text-anchor="middle" font-size="8" fill="#1E40AF">Kinshasa / Goma</text>
    </g>
  </g>
</svg>
