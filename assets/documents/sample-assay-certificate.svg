<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%" fill="none">
  <rect width="800" height="1100" fill="#FAF8F5" stroke="#C9A24B" stroke-width="3"/>
  <rect x="25" y="25" width="750" height="1050" fill="none" stroke="#2D3748" stroke-width="1.5"/>
  <rect x="35" y="35" width="730" height="1030" fill="none" stroke="#C9A24B" stroke-width="0.8" stroke-dasharray="5,2"/>

  <g transform="translate(400, 90)">
    <circle cx="0" cy="20" r="30" fill="none" stroke="#8F6E24" stroke-width="2"/>
    <text x="0" y="26" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="14" fill="#8F6E24">ISO 17025</text>
    <text x="0" y="70" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="24" letter-spacing="2" fill="#1A202C">CERTIFICATE OF METALLURGICAL ASSAY</text>
    <text x="0" y="94" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="12" letter-spacing="2" fill="#8F6E24">FIRE ASSAY &amp; X-RAY FLUORESCENCE SPECTROMETRY</text>
    <text x="0" y="118" text-anchor="middle" font-family="'Inter', monospace" font-size="12" font-weight="700" fill="#4A5568">REPORT NO: ASSAY/2024/B-9982</text>
    <line x1="-300" y1="130" x2="300" y2="130" stroke="#C9A24B" stroke-width="1.5"/>
  </g>

  <g transform="translate(90, 260)" font-family="'Inter', sans-serif" font-size="13" fill="#2D3748">
    <text x="0" y="20">Client / Depositor: <tspan font-weight="700">Aurum East Africa Bullion Reserve Lot #441</tspan></text>
    <text x="0" y="45">Date of Analysis: <tspan font-weight="600">18th September 2024</tspan></text>
    <text x="0" y="70">Sample Nature: Solid Refined Gold Cast Bar Ingot</text>

    <!-- Lab Results Table -->
    <g transform="translate(0, 100)">
      <rect width="620" height="260" fill="#FFFFFF" stroke="#CBD5E0" rx="6"/>
      <rect width="620" height="38" fill="#14181F" rx="6 6 0 0"/>
      <text x="25" y="24" font-weight="700" font-size="12" fill="#F5F1E8">ELEMENT / PARAMETER</text>
      <text x="250" y="24" font-weight="700" font-size="12" fill="#F5F1E8">TEST METHOD</text>
      <text x="440" y="24" font-weight="700" font-size="12" fill="#F5F1E8">DETERMINED VALUE</text>
      <text x="560" y="24" font-weight="700" font-size="12" fill="#F5F1E8">STATUS</text>

      <g transform="translate(25, 65)">
        <text x="0" y="0" font-weight="700">Gold (Au) Fineness</text>
        <text x="225" y="0">ISO 11426 Fire Assay</text>
        <text x="415" y="0" font-weight="800" font-size="15" fill="#15803D">999.91 ‰</text>
        <text x="535" y="0" font-weight="700" fill="#15803D">PASSED</text>

        <line x1="0" y1="20" x2="570" y2="20" stroke="#E2E8F0"/>

        <text x="0" y="45">Silver (Ag)</text>
        <text x="225" y="45">XRF Spectrometry</text>
        <text x="415" y="45">0.05 ‰</text>
        <text x="535" y="45" fill="#64748B">Trace</text>

        <line x1="0" y1="65" x2="570" y2="65" stroke="#E2E8F0"/>

        <text x="0" y="90">Copper (Cu)</text>
        <text x="225" y="90">XRF Spectrometry</text>
        <text x="415" y="90">0.02 ‰</text>
        <text x="535" y="45" fill="#64748B">Trace</text>

        <line x1="0" y1="110" x2="570" y2="110" stroke="#E2E8F0"/>

        <text x="0" y="135">Gross Ingot Weight</text>
        <text x="225" y="135">Mettler Toledo Calibrated Balance</text>
        <text x="415" y="135" font-weight="700">1,000.02 g</text>
        <text x="535" y="135" font-weight="700" fill="#15803D">VERIFIED</text>

        <line x1="0" y1="155" x2="570" y2="155" stroke="#E2E8F0"/>

        <text x="0" y="180">Pure Gold Weight</text>
        <text x="225" y="180">Calculated Pure Yield</text>
        <text x="415" y="180" font-weight="800" fill="#B45309">999.93 g</text>
        <text x="535" y="180" font-weight="700" fill="#15803D">FINAL</text>
      </g>
    </g>

    <g transform="translate(0, 420)">
      <rect width="620" height="90" fill="#ECFDF5" stroke="#10B981" rx="6"/>
      <text x="25" y="30" font-weight="700" font-size="13" fill="#065F46">METALLURGICAL CONCLUSION:</text>
      <text x="25" y="55" font-size="12" fill="#047857">The analyzed bar conforms fully to London Bullion Market Association (LBMA) 999.9 Good Delivery standards.</text>
    </g>

    <g transform="translate(360, 560)">
      <line x1="0" y1="50" x2="220" y2="50" stroke="#1A202C"/>
      <text x="0" y="70" font-weight="700" font-size="11">CHIEF METALLURGICAL ASSAYER</text>
      <text x="0" y="88" font-size="10" fill="#64748B">Chartered Chemical Laboratory, Nairobi</text>
    </g>
  </g>
</svg>
