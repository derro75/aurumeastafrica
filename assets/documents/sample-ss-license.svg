<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%" fill="none">
  <rect width="800" height="1100" fill="#FAF8F5" stroke="#C9A24B" stroke-width="3"/>
  <rect x="25" y="25" width="750" height="1050" fill="none" stroke="#2D3748" stroke-width="1.5"/>
  <g transform="translate(400, 100)">
