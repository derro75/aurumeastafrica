  <g transform="translate(100, 320)" font-family="'Inter', sans-serif" font-size="13" fill="#2D3748">
    <text x="0" y="25">This is to certify that pursuant to the Mining Act, 2012 of South Sudan,</text>
    <text x="0" y="65" font-weight="700" font-size="16" fill="#1A202C">AURUM EAST AFRICA (SOUTH SUDAN) LIMITED</text>
    <text x="0" y="90" fill="#4B5563">Commercial Registration: Juba Central Equatoria No. 44,912</text>
    <text x="0" y="115" fill="#4B5563">Trading Address: Ministries Road, Juba Center Commercial Tower, 2nd Floor, Juba</text>

    <text x="0" y="160">is hereby granted legal authorization to purchase, aggregate, store in secure custody,</text>
    <text x="0" y="185">and export precious minerals in compliance with statutory mining regulations.</text>

    <g transform="translate(0, 230)">
