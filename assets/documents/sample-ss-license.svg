      <text x="25" y="35" font-weight="700" font-size="12" fill="#166534">PERMIT DETAILS:</text>
      <text x="25" y="65" font-size="11" fill="#15803D">Issue Date: 5th April 2024 | Expiry Date: 4th April 2026</text>
      <text x="25" y="90" font-size="11" fill="#15803D">Cadastre Code: RSS-JUB-DEALER-419 | Clearance: Directorate of Mining</text>
