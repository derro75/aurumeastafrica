<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100" fill="none">
  <defs>
    <linearGradient id="aurumGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D49C" />
      <stop offset="35%" stop-color="#C9A24B" />
      <stop offset="70%" stop-color="#8F6E24" />
      <stop offset="100%" stop-color="#DEB86A" />
    </linearGradient>
    <linearGradient id="aurumPlateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#181C24" />
      <stop offset="100%" stop-color="#0E1116" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C9A24B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(15, 10)">
    <!-- Shield / Crucible Outer Octagon -->
    <polygon points="40,2 72,18 78,54 52,78 28,78 2,54 8,18" fill="url(#aurumPlateGrad)" stroke="url(#aurumGoldGrad)" stroke-width="1.75" />
    <!-- Inner Geometric Bullion Ingot Geometry -->
    <path d="M40,12 L64,25 L40,38 L16,25 Z" fill="url(#aurumGoldGrad)" opacity="0.9" />
    <path d="M16,25 L40,38 L40,68 L16,55 Z" fill="#8F6E24" opacity="0.95" />
    <path d="M40,38 L64,25 L64,55 L40,68 Z" fill="#C9A24B" />
    <!-- Fine Hallmarking Lines -->
    <circle cx="40" cy="40" r="2.5" fill="#FFF2CE" />
    <line x1="40" y1="2" x2="40" y2="12" stroke="url(#aurumGoldGrad)" stroke-width="1" />
    <line x1="40" y1="68" x2="40" y2="78" stroke="url(#aurumGoldGrad)" stroke-width="1" />
  </g>

  <!-- Typography: Luxury Bank Styling -->
  <g transform="translate(110, 20)">
    <!-- Brand Name -->
    <text x="0" y="32" font-family="'Cormorant Garamond', 'Playfair Display', 'Times New Roman', serif" font-size="34" font-weight="700" letter-spacing="4.5" fill="#F5F1E8">AURUM</text>
    <text x="160" y="32" font-family="'Inter', 'Manrope', 'Helvetica Neue', sans-serif" font-size="14" font-weight="600" letter-spacing="5" fill="#C9A24B">EAST AFRICA</text>
    <!-- Subtitle / Descriptors -->
    <text x="2" y="52" font-family="'Inter', 'Manrope', sans-serif" font-size="9" font-weight="500" letter-spacing="2.8" fill="#A8A396">PRECIOUS METALS HOUSE • NAIROBI • GOMA • JUBA</text>
    <line x1="2" y1="60" x2="380" y2="60" stroke="url(#aurumGoldGrad)" stroke-width="0.8" opacity="0.6" />
    <text x="2" y="70" font-family="'Inter', 'Manrope', monospace" font-size="7.5" font-weight="500" letter-spacing="1.5" fill="#888275">LICENSED MINERAL DEALER • ASSAYED 999.9 BULLION</text>
  </g>
</svg>
