<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 550" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="heroLight" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#212836" />
      <stop offset="70%" stop-color="#101319" />
      <stop offset="100%" stop-color="#080A0D" />
    </radialGradient>
    <linearGradient id="gBar1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CA" />
      <stop offset="35%" stop-color="#DFBA67" />
      <stop offset="70%" stop-color="#A47C26" />
      <stop offset="100%" stop-color="#6E4D12" />
    </linearGradient>
    <filter id="stackShadow">
      <feDropShadow dx="0" dy="30" stdDeviation="25" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#C9A24B" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="700" height="550" rx="16" fill="url(#heroLight)"/>
  <ellipse cx="350" cy="460" rx="260" ry="40" fill="#030406" opacity="0.9"/>
  <ellipse cx="350" cy="450" rx="200" ry="20" fill="#C9A24B" opacity="0.1" filter="blur(14px)"/>

  <!-- Pyramid Stack of 3 Bullion Kilobars -->
  <g transform="translate(130, 140)" filter="url(#stackShadow)">
    <!-- Base Bar Left -->
    <g transform="translate(0, 140)">
      <polygon points="40,110 240,110 255,85 15,85" fill="#5A3F0E" />
      <rect x="15" y="0" width="240" height="85" rx="6" fill="url(#gBar1)" stroke="#FFE89E" stroke-width="0.8"/>
      <text x="135" y="45" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="16" fill="#4B350A">AURUM 1000g</text>
      <text x="135" y="65" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#4B350A">999.9</text>
    </g>

    <!-- Base Bar Right -->
    <g transform="translate(200, 140)">
      <polygon points="40,110 240,110 255,85 15,85" fill="#5A3F0E" />
      <rect x="15" y="0" width="240" height="85" rx="6" fill="url(#gBar1)" stroke="#FFE89E" stroke-width="0.8"/>
      <text x="135" y="45" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="16" fill="#4B350A">AURUM 1000g</text>
      <text x="135" y="65" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#4B350A">999.9</text>
    </g>

    <!-- Top Crown Bar (Centered) -->
    <g transform="translate(100, 40)">
      <polygon points="40,110 240,110 255,85 15,85" fill="#4E3609" />
      <rect x="15" y="0" width="240" height="85" rx="6" fill="url(#gBar1)" stroke="#FFF4C7" stroke-width="1"/>
      <text x="135" y="32" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="15" letter-spacing="2" fill="#4B350A">AURUM EAST AFRICA</text>
      <text x="135" y="52" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="18" fill="#4B350A">1000 g FINE GOLD</text>
      <text x="135" y="72" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="20" letter-spacing="2" fill="#4B350A">999.9</text>
    </g>
  </g>

  <!-- Floating Floating Spec Badge -->
  <g transform="translate(440, 50)">
    <rect width="210" height="60" rx="10" fill="#141820" stroke="#C9A24B" stroke-width="1.2"/>
    <text x="20" y="26" font-family="'Inter', sans-serif" font-size="10" fill="#A8A396">LBMA GOOD DELIVERY SPEC</text>
    <text x="20" y="46" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#F5F1E8">Certified 999.9 Purity</text>
  </g>
</svg>
