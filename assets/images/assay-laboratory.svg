<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="labBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#19202B" />
      <stop offset="100%" stop-color="#090B0E" />
    </radialGradient>
  </defs>

  <rect width="700" height="450" rx="16" fill="url(#labBg)" stroke="#222A38" stroke-width="1.5"/>

  <!-- Cleanroom Bench / Lab Instruments -->
  <line x1="80" y1="360" x2="620" y2="360" stroke="#334155" stroke-width="4"/>

  <!-- Spectrometer Unit (XRF) -->
  <g transform="translate(140, 160)">
    <rect width="180" height="200" rx="10" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
    <rect x="20" y="20" width="140" height="70" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <!-- Digital Spectral Curve -->
    <path d="M30,75 L60,70 L80,35 L95,72 L120,70 L140,75" stroke="#38BDF8" stroke-width="2" fill="none"/>
    <text x="35" y="32" font-family="'Inter', monospace" font-size="8" fill="#38BDF8">SPECTROMETRY: Au 99.99%</text>

    <!-- Sample Chamber Door -->
    <rect x="40" y="110" width="100" height="70" rx="4" fill="#0F172A" stroke="#C9A24B" stroke-width="1.2"/>
    <rect x="70" y="130" width="40" height="25" rx="3" fill="#D4AF37"/>
    <text x="90" y="170" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" fill="#94A3B8">CHAMBER</text>
  </g>

  <!-- High-Precision Analytical Microbalance -->
  <g transform="translate(380, 190)">
    <rect width="160" height="170" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
    <!-- Glass Draft Shield -->
    <rect x="25" y="20" width="110" height="85" rx="4" fill="#0F172A" opacity="0.6" stroke="#94A3B8" stroke-width="1"/>
    <!-- Balance Pan & Bullion Bar -->
    <ellipse cx="80" cy="85" rx="30" ry="8" fill="#64748B"/>
    <rect x="65" y="68" width="30" height="16" rx="2" fill="#E5C77A" stroke="#8F6E24" stroke-width="1"/>

    <!-- Digital Display -->
    <rect x="30" y="120" width="100" height="30" rx="4" fill="#022C22" stroke="#10B981" stroke-width="1"/>
    <text x="80" y="140" text-anchor="middle" font-family="'Inter', monospace" font-size="12" font-weight="700" fill="#34D399">1000.02 g</text>
  </g>

  <!-- Lab Banner -->
  <g transform="translate(480, 50)">
    <rect width="180" height="42" rx="8" fill="#141820" stroke="#C9A24B" stroke-width="1"/>
    <text x="90" y="26" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#E5C77A">ISO/IEC 17025 ACCREDITED</text>
  </g>
</svg>
