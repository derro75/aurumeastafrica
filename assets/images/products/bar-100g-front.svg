<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="studioLighting100" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1B2028" />
      <stop offset="60%" stop-color="#101318" />
      <stop offset="100%" stop-color="#080A0D" />
    </radialGradient>
    <linearGradient id="blisterCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D2430" />
      <stop offset="50%" stop-color="#12161D" />
      <stop offset="100%" stop-color="#0B0D11" />
    </linearGradient>
    <linearGradient id="bar100Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E0" />
      <stop offset="25%" stop-color="#ECD08B" />
      <stop offset="60%" stop-color="#C9A24B" />
      <stop offset="100%" stop-color="#7B5614" />
    </linearGradient>
    <filter id="blisterShadow">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#C9A24B" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="600" height="700" rx="16" fill="url(#studioLighting100)"/>
  <ellipse cx="300" cy="580" rx="170" ry="26" fill="#000000" opacity="0.85" />

  <!-- Sealed Certi-Assay Blister Card Container -->
  <g transform="translate(140, 80)" filter="url(#blisterShadow)">
    <rect width="320" height="480" rx="16" fill="url(#blisterCardGrad)" stroke="#C9A24B" stroke-width="1.5"/>
    
    <!-- Micro-line Security guilloche perimeter -->
    <rect x="12" y="12" width="296" height="456" rx="12" fill="none" stroke="#3A2E14" stroke-width="1"/>

    <!-- Issuer Header -->
    <text x="160" y="44" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="18" letter-spacing="3" fill="#F5F1E8">AURUM EAST AFRICA</text>
    <text x="160" y="58" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="7.5" letter-spacing="2" fill="#C9A24B">CERTIFIED ASSAY ASSURANCE</text>

    <!-- Translucent Plastic Blister Cavity -->
    <rect x="75" y="80" width="170" height="260" rx="12" fill="#000000" opacity="0.3" stroke="#504221" stroke-width="1"/>
    
    <!-- Gold Bar inside Blister -->
    <g transform="translate(85, 90)">
      <rect width="150" height="240" rx="6" fill="url(#bar100Grad)" stroke="#FFECA8" stroke-width="1"/>
      <rect x="4" y="4" width="142" height="232" rx="4" fill="none" stroke="#FFF7D8" stroke-width="0.7" opacity="0.7"/>

      <!-- Mirror Shine Highlight -->
      <polygon points="10,4 80,4 20,236 10,236" fill="#FFFFFF" opacity="0.15" />

      <circle cx="75" cy="40" r="16" fill="none" stroke="#52390B" stroke-width="1.5"/>
      <text x="75" y="45" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="10" fill="#52390B">AEA</text>

      <text x="75" y="78" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="14" letter-spacing="2" fill="#52390B">AURUM</text>
      <text x="75" y="125" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="18" fill="#52390B">100 g</text>
      <text x="75" y="142" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="9" letter-spacing="1.5" fill="#52390B">FINE GOLD</text>
      <text x="75" y="175" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="22" fill="#52390B">999.9</text>
      <text x="75" y="215" text-anchor="middle" font-family="'Inter', monospace" font-size="9" font-weight="700" fill="#52390B">AE100-8839</text>
    </g>

    <!-- Card Specs Below Blister -->
    <g transform="translate(25, 370)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="9" fill="#A8A396">Certified Fineness:</text>
      <text x="270" y="0" text-anchor="end" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#34D399">999.9 / 1000 Fine Gold</text>

      <text x="0" y="18" font-family="'Inter', sans-serif" font-size="9" fill="#A8A396">Assayer Hallmark:</text>
      <text x="270" y="18" text-anchor="end" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#F5F1E8">Chief Metallurgist</text>

      <text x="0" y="36" font-family="'Inter', sans-serif" font-size="9" fill="#A8A396">Certificate Number:</text>
      <text x="270" y="36" text-anchor="end" font-family="'Inter', monospace" font-size="9" font-weight="700" fill="#E5C77A">AE100-8839</text>

      <line x1="0" y1="46" x2="270" y2="46" stroke="#2D3748" stroke-width="1"/>
      <text x="135" y="60" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7.5" fill="#888275">SEALED ASSAY SECURITY PACKAGING • DO NOT TAMPER</text>
    </g>
  </g>
</svg>
