<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="studioLightingDore" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1B2028" />
      <stop offset="60%" stop-color="#101318" />
      <stop offset="100%" stop-color="#080A0D" />
    </radialGradient>
    <linearGradient id="doreGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED596" />
      <stop offset="35%" stop-color="#B8923E" />
      <stop offset="70%" stop-color="#806222" />
      <stop offset="100%" stop-color="#553F12" />
    </linearGradient>
    <linearGradient id="doreGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEBE71" />
      <stop offset="50%" stop-color="#9E792B" />
      <stop offset="100%" stop-color="#4B370E" />
    </linearGradient>
    <filter id="doreShadow">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="600" height="700" rx="16" fill="url(#studioLightingDore)"/>
  <ellipse cx="300" cy="570" rx="200" ry="34" fill="#000000" opacity="0.85" />

  <!-- Multiple Raw Unrefined Smelted Dore Ingot Bars (Wholesale Lot) -->
  <g transform="translate(100, 150)" filter="url(#doreShadow)">
    <!-- Back Dore Ingot -->
    <path d="M110,130 L270,110 L370,160 L200,190 Z" fill="url(#doreGrad1)" stroke="#D4B056" stroke-width="1.2"/>
    <path d="M200,190 L370,160 L370,210 L200,240 Z" fill="#5E4516" />

    <!-- Left Doré Ingot -->
    <path d="M20,240 L190,210 L260,280 L90,320 Z" fill="url(#doreGrad2)" stroke="#CBA447" stroke-width="1.2"/>
    <path d="M90,320 L260,280 L260,340 L90,380 Z" fill="#4B360F" />

    <!-- Front Doré Bar with Natural Cooling Slag / Smelting Texture -->
    <path d="M120,280 L320,250 L400,340 L200,380 Z" fill="url(#doreGrad1)" stroke="#FFE08A" stroke-width="1.2"/>
    <path d="M200,380 L400,340 L400,410 L200,450 Z" fill="#694D18" />

    <!-- Rough Poured Texture Marks -->
    <circle cx="240" cy="320" r="12" fill="#88641C" opacity="0.4"/>
    <circle cx="310" cy="300" r="18" fill="#583F0F" opacity="0.4"/>
    <path d="M160,340 Q250,330 350,310" stroke="#FFE9A8" stroke-width="1" opacity="0.4" fill="none"/>

    <!-- Lot Tag -->
    <g transform="translate(190, 390)">
      <rect width="180" height="32" rx="6" fill="#13171F" stroke="#C9A24B" stroke-width="1"/>
      <text x="90" y="20" text-anchor="middle" font-family="'Inter', monospace" font-size="10" font-weight="700" fill="#E5C77A">COMMERCIAL LOT • ASSAY BASIS</text>
    </g>
  </g>

  <g transform="translate(360, 50)">
    <rect width="200" height="34" rx="17" fill="#14181F" stroke="#C9A24B" stroke-width="1"/>
    <text x="100" y="21" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#F5F1E8">Sourced from Verified Mines</text>
  </g>
</svg>
