<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="studioLighting500A" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#191E25" />
      <stop offset="100%" stop-color="#080A0D" />
    </radialGradient>
    <linearGradient id="angTop500" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE" />
      <stop offset="40%" stop-color="#DCB55B" />
      <stop offset="100%" stop-color="#84601A" />
    </linearGradient>
    <linearGradient id="angSide500" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B5614" />
      <stop offset="100%" stop-color="#3D2906" />
    </linearGradient>
    <filter id="angleShadow500">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="600" height="700" rx="16" fill="url(#studioLighting500A)"/>
  <ellipse cx="300" cy="570" rx="180" ry="30" fill="#000000" opacity="0.85" />

  <!-- 3D Slanted Angle 500g Bar -->
  <g transform="translate(130, 150)" filter="url(#angleShadow500)">
    <polygon points="50,320 280,390 280,440 50,370" fill="#936B1C" />
    <polygon points="280,390 380,220 380,270 280,440" fill="url(#angSide500)" />
    <polygon points="50,320 150,150 380,220 280,390" fill="url(#angTop500)" />

    <g transform="translate(230, 260) rotate(18) skewX(-15)">
      <circle cx="0" cy="-40" r="14" fill="none" stroke="#483207" stroke-width="1.8" />
      <text x="0" y="-10" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="16" fill="#483207">AURUM</text>
      <text x="0" y="25" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="20" fill="#483207">500g 999.9</text>
    </g>
  </g>
</svg>
