<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="studioLighting1oz" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1B2028" />
      <stop offset="100%" stop-color="#080A0D" />
    </radialGradient>
    <linearGradient id="ozGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E4" />
      <stop offset="25%" stop-color="#EDD38E" />
      <stop offset="60%" stop-color="#C9A24B" />
      <stop offset="100%" stop-color="#7B5614" />
    </linearGradient>
    <filter id="shadow1oz">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#C9A24B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="700" rx="16" fill="url(#studioLighting1oz)"/>
  <ellipse cx="300" cy="560" rx="150" ry="24" fill="#000000" opacity="0.8" />

  <!-- 1 Troy Ounce Bar inside Proof Card Blister -->
  <g transform="translate(160, 90)" filter="url(#shadow1oz)">
    <rect width="280" height="460" rx="14" fill="#13171F" stroke="#C9A24B" stroke-width="1.5"/>
    <rect x="10" y="10" width="260" height="440" rx="10" fill="none" stroke="#3A2F16" stroke-width="1"/>

    <text x="140" y="44" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="17" letter-spacing="3" fill="#F5F1E8">AURUM EAST AFRICA</text>
    <text x="140" y="58" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="7.5" letter-spacing="2" fill="#E5C77A">1 TROY OUNCE • 31.1035g</text>

    <!-- Blister Well -->
    <rect x="70" y="80" width="140" height="230" rx="10" fill="#000000" opacity="0.35" stroke="#483818" stroke-width="1"/>

    <!-- 1oz Ingot -->
    <g transform="translate(78, 88)">
      <rect width="124" height="214" rx="6" fill="url(#ozGoldGrad)" stroke="#FFF4CF" stroke-width="1"/>
      <rect x="4" y="4" width="116" height="206" rx="4" fill="none" stroke="#FFEBB0" stroke-width="0.7" opacity="0.8"/>
      <polygon points="8,4 60,4 16,210 8,210" fill="#FFFFFF" opacity="0.16"/>

      <circle cx="62" cy="36" r="14" fill="none" stroke="#52390B" stroke-width="1.4"/>
      <text x="62" y="40" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="9" fill="#52390B">AEA</text>

      <text x="62" y="72" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="13" letter-spacing="1.5" fill="#52390B">AURUM</text>
      <text x="62" y="112" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#52390B">1 OUNCE</text>
      <text x="62" y="128" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="8.5" letter-spacing="1" fill="#52390B">FINE GOLD</text>
      <text x="62" y="158" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="20" fill="#52390B">999.9</text>
      <text x="62" y="194" text-anchor="middle" font-family="'Inter', monospace" font-size="8" font-weight="700" fill="#52390B">OZ-24-9018</text>
    </g>

    <g transform="translate(20, 345)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="9" fill="#A8A396">Standard Fineness:</text>
      <text x="240" y="0" text-anchor="end" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#34D399">999.9 (24 Karat)</text>
      <text x="0" y="18" font-family="'Inter', sans-serif" font-size="9" fill="#A8A396">Net Pure Content:</text>
      <text x="240" y="18" text-anchor="end" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#F5F1E8">31.1035 Grams</text>
      <text x="0" y="36" font-family="'Inter', sans-serif" font-size="9" fill="#A8A396">Serial Number:</text>
      <text x="240" y="36" text-anchor="end" font-family="'Inter', monospace" font-size="9" font-weight="700" fill="#E5C77A">OZ-24-9018</text>
      <line x1="0" y1="46" x2="240" y2="46" stroke="#2D3748" stroke-width="1"/>
      <text x="120" y="60" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7.5" fill="#888275">INTERNATIONAL LIQUIDITY STANDARD</text>
    </g>
  </g>
</svg>
