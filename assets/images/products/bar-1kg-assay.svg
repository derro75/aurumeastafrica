<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="assayStudioGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1B212B" />
      <stop offset="100%" stop-color="#090B0F" />
    </radialGradient>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#ECE6D8" />
    </linearGradient>
    <linearGradient id="goldBarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0" />
      <stop offset="50%" stop-color="#C9A24B" />
      <stop offset="100%" stop-color="#805D17" />
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="600" height="700" rx="16" fill="url(#assayStudioGrad)"/>

  <!-- Official Assay Certificate Card -->
  <g transform="translate(90, 80)" filter="url(#cardShadow)">
    <rect width="420" height="540" rx="14" fill="url(#certBg)" stroke="#C9A24B" stroke-width="2"/>
    
    <!-- Guilloche Security Border (Simplified vector) -->
    <rect x="15" y="15" width="390" height="510" rx="8" fill="none" stroke="#D3BD8A" stroke-width="1" stroke-dasharray="4,2"/>
    
    <!-- Watermark Crest -->
    <circle cx="210" cy="270" r="90" fill="#E8DEC8" opacity="0.4"/>

    <!-- Certificate Header -->
    <text x="210" y="55" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="20" letter-spacing="3" fill="#1A202C">CERTIFICATE OF ASSAY &amp; ORIGIN</text>
    <text x="210" y="75" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="9" letter-spacing="2" fill="#8F6E24">AURUM EAST AFRICA PRECIOUS METALS REFINERY</text>
    <line x1="50" y1="90" x2="370" y2="90" stroke="#C9A24B" stroke-width="1"/>

    <!-- Embedded Bar Miniature representation -->
    <rect x="145" y="115" width="130" height="180" rx="8" fill="url(#goldBarGrad)" stroke="#FFE89E" stroke-width="1" />
    <text x="210" y="175" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="14" font-weight="700" fill="#4B3608">AURUM</text>
    <text x="210" y="210" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#4B3608">1000g</text>
    <text x="210" y="235" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#4B3608">999.9</text>

    <!-- Lab Test Results Table -->
    <g transform="translate(45, 330)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#2D3748">Assay Parameters</text>
      <line x1="0" y1="8" x2="330" y2="8" stroke="#CBD5E0" stroke-width="1"/>
      
      <text x="0" y="28" font-family="'Inter', sans-serif" font-size="10" fill="#718096">Lot Number:</text>
      <text x="330" y="28" text-anchor="end" font-family="'Inter', monospace" font-size="10" font-weight="600" fill="#1A202C">AEA-2024-LOT-441</text>
      
      <text x="0" y="48" font-family="'Inter', sans-serif" font-size="10" fill="#718096">Serial Number:</text>
      <text x="330" y="48" text-anchor="end" font-family="'Inter', monospace" font-size="10" font-weight="600" fill="#1A202C">AE24-108892</text>

      <text x="0" y="68" font-family="'Inter', sans-serif" font-size="10" fill="#718096">Gross Weight:</text>
      <text x="330" y="68" text-anchor="end" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#1A202C">1,000.00 grams (±0.02g)</text>

      <text x="0" y="88" font-family="'Inter', sans-serif" font-size="10" fill="#718096">Fineness (Certified):</text>
      <text x="330" y="88" text-anchor="end" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#16A34A">999.9 / 1000 Fine Gold</text>

      <text x="0" y="108" font-family="'Inter', sans-serif" font-size="10" fill="#718096">Testing Methodology:</text>
      <text x="330" y="108" text-anchor="end" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#1A202C">XRF &amp; Fire Assay (ISO 17025)</text>
    </g>

    <!-- Sworn Assayer Signature Seal -->
    <g transform="translate(60, 480)">
      <circle cx="20" cy="0" r="18" fill="#8F6E24" opacity="0.15" stroke="#8F6E24" stroke-width="1"/>
      <text x="50" y="-4" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#2D3748">Certified Chief Metallurgist</text>
      <text x="50" y="8" font-family="'Inter', cursive" font-size="11" fill="#4A5568">M. Kiprono, C.Eng</text>
    </g>

    <!-- QR Code Graphic Mock -->
    <g transform="translate(320, 450)">
      <rect width="50" height="50" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1"/>
      <rect x="5" y="5" width="16" height="16" fill="#1A202C"/>
      <rect x="29" y="5" width="16" height="16" fill="#1A202C"/>
      <rect x="5" y="29" width="16" height="16" fill="#1A202C"/>
      <rect x="25" y="25" width="6" height="6" fill="#1A202C"/>
      <text x="25" y="58" text-anchor="middle" font-family="'Inter', sans-serif" font-size="6" fill="#718096">VERIFY SCAN</text>
    </g>
  </g>
</svg>
