<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background studio dark vignette -->
    <radialGradient id="studioLighting" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1B2028" />
      <stop offset="60%" stop-color="#101318" />
      <stop offset="100%" stop-color="#080A0D" />
    </radialGradient>

    <!-- Rich Metallic Cast Gold Gradients -->
    <linearGradient id="barFaceGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFF0C4" />
      <stop offset="18%" stop-color="#E5C77A" />
      <stop offset="42%" stop-color="#D3A744" />
      <stop offset="65%" stop-color="#A57D28" />
      <stop offset="85%" stop-color="#DFBD6D" />
      <stop offset="100%" stop-color="#84601A" />
    </linearGradient>

    <linearGradient id="bevelTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="100%" stop-color="#B88A2D" />
    </linearGradient>

    <linearGradient id="bevelSideGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#6F4E12" />
      <stop offset="100%" stop-color="#463109" />
    </linearGradient>

    <linearGradient id="stampedTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A340B" />
      <stop offset="50%" stop-color="#735215" />
      <stop offset="100%" stop-color="#2D1F06" />
    </linearGradient>

    <filter id="castShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="25" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#C9A24B" flood-opacity="0.25" />
    </filter>

    <filter id="stampBevel">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="#FFEBB0" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="-1" stdDeviation="0.8" flood-color="#2E1F04" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="600" height="700" rx="16" fill="url(#studioLighting)"/>

  <!-- Reflection Podium Base -->
  <ellipse cx="300" cy="570" rx="180" ry="32" fill="#050709" opacity="0.9" />
  <ellipse cx="300" cy="565" rx="150" ry="18" fill="#C9A24B" opacity="0.12" filter="blur(10px)"/>

  <!-- 1KG Bullion Cast Bar Group -->
  <g transform="translate(160, 90)" filter="url(#castShadow)">
    <!-- Base Extrusion / Beveled Bottom Profile -->
    <polygon points="15,485 265,485 280,455 0,455" fill="url(#bevelSideGrad)" />
    
    <!-- Outer Ingot Body -->
    <rect x="0" y="20" width="280" height="440" rx="12" fill="url(#bevelTopGrad)" />

    <!-- Inward Tapering Top Face (Cast Ingot Trapeze) -->
    <rect x="18" y="36" width="244" height="408" rx="8" fill="url(#barFaceGrad)" />

    <!-- Fine Cooling Ripples & Brushed Grain -->
    <path d="M22,70 Q140,78 258,68" stroke="#FFE9A8" stroke-width="0.8" opacity="0.35" fill="none" />
    <path d="M22,120 Q150,112 258,124" stroke="#8E671E" stroke-width="0.8" opacity="0.4" fill="none" />
    <path d="M22,230 Q130,238 258,228" stroke="#FFE9A8" stroke-width="0.8" opacity="0.3" fill="none" />
    <path d="M22,340 Q160,332 258,342" stroke="#8E671E" stroke-width="0.7" opacity="0.3" fill="none" />

    <!-- Official Mint Stamping & Hallmarking -->
    <g transform="translate(140, 95)" filter="url(#stampBevel)">
      <!-- Octagonal Stamp Seal -->
      <polygon points="0,-32 26,-18 32,10 16,30 -16,30 -32,10 -26,-18" fill="none" stroke="url(#stampedTextGrad)" stroke-width="2.5" />
      <circle cx="0" cy="-2" r="16" fill="none" stroke="url(#stampedTextGrad)" stroke-width="1.5" />
      <text x="0" y="2" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="12" fill="url(#stampedTextGrad)">AEA</text>
    </g>

    <!-- Brand Header Stamped -->
    <text x="140" y="165" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="20" letter-spacing="3" fill="url(#stampedTextGrad)" filter="url(#stampBevel)">AURUM</text>
    <text x="140" y="184" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="9" letter-spacing="4" fill="url(#stampedTextGrad)">EAST AFRICA</text>

    <!-- Weight & Fineness -->
    <text x="140" y="250" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="26" letter-spacing="2" fill="url(#stampedTextGrad)" filter="url(#stampBevel)">1000 g</text>
    <text x="140" y="278" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="12" letter-spacing="3" fill="url(#stampedTextGrad)">FINE GOLD</text>
    <text x="140" y="325" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="34" letter-spacing="3" fill="url(#stampedTextGrad)" filter="url(#stampBevel)">999.9</text>

    <!-- Assayer Mark -->
    <g transform="translate(140, 375)">
      <rect x="-42" y="-14" width="84" height="26" rx="4" fill="none" stroke="url(#stampedTextGrad)" stroke-width="1.2" />
      <text x="0" y="3" text-anchor="middle" font-family="'Inter', monospace" font-size="9" font-weight="700" letter-spacing="1" fill="url(#stampedTextGrad)">MELTER ASSAYER</text>
    </g>

    <!-- Serial Number -->
    <text x="140" y="426" text-anchor="middle" font-family="'Inter', monospace" font-size="13" font-weight="700" letter-spacing="2" fill="url(#stampedTextGrad)" filter="url(#stampBevel)">AE24-108892</text>
  </g>

  <!-- Purity Hallmark Ribbon Tag -->
  <g transform="translate(410, 48)">
    <rect width="150" height="34" rx="17" fill="#14181F" stroke="#C9A24B" stroke-width="1"/>
    <circle cx="20" cy="17" r="4.5" fill="#34D399" />
    <text x="32" y="21" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#F5F1E8" letter-spacing="0.5">Assay Verified 999.9</text>
  </g>
</svg>
