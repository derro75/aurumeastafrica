<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="studioLighting2" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#191F26" />
      <stop offset="70%" stop-color="#0E1217" />
      <stop offset="100%" stop-color="#07090C" />
    </radialGradient>
    <linearGradient id="barAngleTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CA" />
      <stop offset="30%" stop-color="#E1BD69" />
      <stop offset="70%" stop-color="#B88A2D" />
      <stop offset="100%" stop-color="#765416" />
    </linearGradient>
    <linearGradient id="barAngleSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A7223" />
      <stop offset="50%" stop-color="#604311" />
      <stop offset="100%" stop-color="#3A2707" />
    </linearGradient>
    <linearGradient id="barAngleFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DEB65E" />
      <stop offset="100%" stop-color="#553C0E" />
    </linearGradient>
    <filter id="shadow3D">
      <feDropShadow dx="-10" dy="28" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#C9A24B" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="600" height="700" rx="16" fill="url(#studioLighting2)"/>
  
  <ellipse cx="280" cy="580" rx="210" ry="36" fill="#000000" opacity="0.85" />

  <!-- 3D Isometric View of 1kg Bullion Bar -->
  <g transform="translate(100, 140)" filter="url(#shadow3D)">
    <!-- Front Face -->
    <polygon points="90,380 320,440 320,490 90,430" fill="url(#barAngleFront)" />
    <!-- Right Face (Depth) -->
    <polygon points="320,440 430,260 430,305 320,490" fill="url(#barAngleSide)" />
    <!-- Top Face (Main Surface) -->
    <polygon points="90,380 200,200 430,260 320,440" fill="url(#barAngleTop)" />

    <!-- Stamped Elements Skewed -->
    <g transform="translate(260, 310) rotate(15) skewX(-20)">
      <circle cx="0" cy="-60" r="16" fill="none" stroke="#52390B" stroke-width="2" />
      <text x="0" y="-55" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="12" fill="#52390B">AEA</text>
      <text x="0" y="-20" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="18" letter-spacing="2" fill="#52390B">AURUM</text>
      <text x="0" y="20" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="22" fill="#52390B">1000g</text>
      <text x="0" y="55" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="26" fill="#52390B">999.9</text>
      <text x="0" y="90" text-anchor="middle" font-family="'Inter', monospace" font-weight="700" font-size="11" letter-spacing="1" fill="#52390B">AE24-108892</text>
    </g>
  </g>

  <g transform="translate(380, 50)">
    <rect width="180" height="34" rx="17" fill="#14181F" stroke="#C9A24B" stroke-width="1"/>
    <text x="90" y="21" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#E5C77A">Cast Ripple Perspective</text>
  </g>
</svg>
