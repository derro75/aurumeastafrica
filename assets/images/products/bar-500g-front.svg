<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="studioLighting500" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1B2028" />
      <stop offset="60%" stop-color="#101318" />
      <stop offset="100%" stop-color="#080A0D" />
    </radialGradient>
    <linearGradient id="mintedGoldGrad500" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4D4" />
      <stop offset="20%" stop-color="#EED696" />
      <stop offset="50%" stop-color="#C9A24B" />
      <stop offset="80%" stop-color="#8F6E24" />
      <stop offset="100%" stop-color="#DEB86A" />
    </linearGradient>
    <filter id="mintedShadow">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#C9A24B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="700" rx="16" fill="url(#studioLighting500)"/>
  <ellipse cx="300" cy="560" rx="160" ry="26" fill="#000000" opacity="0.8" />

  <!-- 500g Minted Bar (Proof-like sharp rectangular edges) -->
  <g transform="translate(180, 110)" filter="url(#mintedShadow)">
    <rect width="240" height="420" rx="10" fill="#694D14" stroke="#FFF0C2" stroke-width="1.5"/>
    <rect x="8" y="8" width="224" height="404" rx="6" fill="url(#mintedGoldGrad500)"/>
    <rect x="14" y="14" width="212" height="392" rx="4" fill="none" stroke="#FFE7A0" stroke-width="1" opacity="0.7"/>

    <!-- Proof Mirror Shine Streak -->
    <path d="M14,14 L120,14 L50,406 L14,406 Z" fill="#FFFFFF" opacity="0.12"/>

    <!-- Stamping -->
    <circle cx="120" cy="70" r="28" fill="none" stroke="#52390B" stroke-width="2"/>
    <text x="120" y="76" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="16" fill="#52390B">AEA</text>
    
    <text x="120" y="130" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="22" letter-spacing="3" fill="#52390B">AURUM</text>
    <text x="120" y="150" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="9" letter-spacing="3" fill="#52390B">EAST AFRICA</text>

    <text x="120" y="215" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="26" fill="#52390B">500 g</text>
    <text x="120" y="240" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="12" letter-spacing="2" fill="#52390B">FINE GOLD</text>
    
    <text x="120" y="295" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="34" letter-spacing="2" fill="#52390B">999.9</text>

    <rect x="70" y="335" width="100" height="24" rx="4" fill="none" stroke="#52390B" stroke-width="1.2"/>
    <text x="120" y="351" text-anchor="middle" font-family="'Inter', monospace" font-size="9" font-weight="700" fill="#52390B">ESSAYEUR FONDEUR</text>

    <text x="120" y="390" text-anchor="middle" font-family="'Inter', monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#52390B">AE-500-8812</text>
  </g>
</svg>
